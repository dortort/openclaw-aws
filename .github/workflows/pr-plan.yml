name: PR Plan

on:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks (${{ matrix.path }})
    runs-on: ubuntu-latest
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    strategy:
      matrix:
        path:
          - infra/bootstrap
          - infra/main
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init
          tflint

      - name: TFSec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ matrix.path }}

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.path }}

      - name: Setup Infracost
        if: env.INFRACOST_API_KEY != ''
        uses: infracost/actions/setup@v3

      - name: Infracost breakdown
        if: env.INFRACOST_API_KEY != ''
        run: infracost breakdown --path .

  docker-tests:
    name: Docker lint/scan/dgoss
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve OpenClaw release
        id: openclaw
        uses: ./.github/actions/resolve-openclaw-release
        with:
          token: ${{ github.token }}

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          build-args: |
            OPENCLAW_IMAGE_TAG=${{ steps.openclaw.outputs.image_tag }}
            OPENCLAW_VERSION=${{ steps.openclaw.outputs.version }}
          tags: |
            openclaw:pr

      - name: Trivy report (HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openclaw:pr
          format: table
          exit-code: 0
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          timeout: 20m

      - name: Trivy gate (fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openclaw:pr
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
          timeout: 20m
          skip-setup-trivy: true

      - name: Install dgoss
        run: |
          curl -fsSL https://github.com/goss-org/goss/releases/latest/download/goss-linux-amd64 -o /usr/local/bin/goss
          curl -fsSL https://github.com/goss-org/goss/releases/latest/download/dgoss -o /usr/local/bin/dgoss
          chmod +x /usr/local/bin/goss /usr/local/bin/dgoss

      - name: Run dgoss
        env:
          GOSS_FILES_PATH: app
          GOSS_FILE: goss.yaml
          GOSS_OPTS: --retry-timeout 180s --sleep 5s
        run: dgoss run -e OPENCLAW_GATEWAY_TOKEN=dgoss-ci-token openclaw:pr
