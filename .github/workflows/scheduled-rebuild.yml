name: Scheduled Rebuild and Deploy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Scheduled deploy
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
