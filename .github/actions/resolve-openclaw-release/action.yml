name: Resolve OpenClaw release
description: Resolve the latest OpenClaw release tag and its upstream image tag
inputs:
  repo:
    description: GitHub repo to resolve the release from
    default: openclaw/openclaw
    required: false
  token:
    description: GitHub token for API requests
    required: false
outputs:
  version:
    description: Resolved OpenClaw release tag
    value: ${{ steps.resolve.outputs.version }}
  image_tag:
    description: Matching ghcr.io/openclaw/openclaw image tag
    value: ${{ steps.resolve.outputs.image_tag }}
runs:
  using: composite
  steps:
    - name: Resolve latest release tag
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        api_url="https://api.github.com/repos/${{ inputs.repo }}/releases/latest"
        token="${{ inputs.token }}"
        auth_header=()
        if [[ -n "$token" ]]; then
          auth_header=(-H "Authorization: Bearer $token")
        fi
        tag="$(curl -fsSL \
          "${auth_header[@]}" \
          -H "Accept: application/vnd.github+json" \
          "$api_url" | jq -r .tag_name)"
        if [[ -z "$tag" || "$tag" == "null" ]]; then
          echo "Failed to resolve latest release tag from $api_url" >&2
          exit 1
        fi
        echo "version=$tag" >> "$GITHUB_OUTPUT"
        echo "image_tag=${tag#v}" >> "$GITHUB_OUTPUT"
